version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Everything routine arrives as one pull request: one green check to read
      # instead of eleven.
      composer-non-major:
        update-types:
          - "minor"
          - "patch"
      # These two get their own group because a major deserves to be read.
      symfony-major:
        patterns:
          - "symfony/*"
        update-types:
          - "major"
      doctrine-major:
        patterns:
          - "doctrine/*"
        update-types:
          - "major"
      twig-major:
        patterns:
          - "twig/*"
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/assets"
    schedule:
      interval: "weekly"
    groups:
      npm-non-major:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gh-actions-non-major:
        update-types:
          - "minor"
          - "patch"
