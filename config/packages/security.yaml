security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    providers:
        app_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt|error)|build)/
            security: false
        main:
            pattern: ^/
            lazy: true
            provider: app_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
            login_throttling:
                max_attempts: 5

    # Everything is private. Two routes are the way in, and the setup route stops
    # existing once a User exists (FR-1).
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/setup$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hashing is deliberately expensive. In tests that is only latency, so the
            # work factors drop to their floors.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
